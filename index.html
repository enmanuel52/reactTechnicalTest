<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse JSONPlaceholder users and their posts, and write new ones."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>theSocialNetwork</title>
    <script>
      // Apply the saved (or system) theme/language before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('tsn-preferences') || 'null')
        var prefs = (saved && saved.state) || {}
        var dark = prefs.theme
          ? prefs.theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.lang =
          prefs.lang || (/^es/i.test(navigator.language) ? 'es' : 'en')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
